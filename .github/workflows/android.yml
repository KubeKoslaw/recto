name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The hosted Ubuntu image ships the Android SDK (ANDROID_HOME) with licenses accepted;
    # missing SDK components are downloaded by the Android Gradle plugin.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Validates the Gradle wrapper and caches Gradle downloads between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and builds
        run: ./gradlew --no-daemon check assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
